services:
  aniworld:
    # Override with ANIWORLD_IMAGE in .env to run your own build, e.g. a fork
    # published to your own registry. The default is the upstream image, which
    # will NOT contain changes you made locally.
    image: ${ANIWORLD_IMAGE:-ghcr.io/phoenixthrush/aniworld-downloader:latest}
    # build: .
    ports:
      - "8080:8080"

    volumes:
      # The whole storage mount. Downloads are staged under
      # /media/downloads/aniworld; where the finished file finally lands is
      # decided by the root folders configured in Sonarr and Radarr, so this
      # container never creates library folders of its own.
      - /media/jellyfin/storagebox:/media

      # Config, queue database, logs and the Chromium profile.
      #
      # Deliberately a local volume rather than a folder on the storage box:
      # SQLite over SSHFS/NFS has unreliable file locking, and the queue
      # database is written continuously by a 24/7 service. Back it up to the
      # box instead — see docs/DOCKER.md.
      - aniworld-config:/config

    env_file:
      - .env

    restart: unless-stopped

    # Give a running download time to finish its current ffmpeg mux instead of
    # leaving a half-written file behind.
    stop_grace_period: 60s

    # SSHFS drops out from time to time; without this the container keeps
    # serving a UI that cannot write anything.
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/healthcheck.py"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  aniworld-config:
